<text x="40" y="420" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Transaction-based: tests create items (APB read/write, sensor words); drivers turn them into pin wiggles; monitors turn pins back into items.</text></svg>