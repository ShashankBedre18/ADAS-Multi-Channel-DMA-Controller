<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Data movement: processor-centric (before) vs DMA-centric (this project)</text>
<rect x="20" y="48" width="460" height="370" rx="10" fill="#fff" stroke="#c53030" stroke-width="1.5"/>
<text x="250" y="72" font-size="14" font-weight="700" text-anchor="middle" fill="#c53030">BEFORE - CPU copies every word</text>
<rect x="35" y="100" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="85.0" y="127.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Camera</text>
<rect x="35" y="170" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="85.0" y="197.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Radar</text>
<rect x="35" y="240" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="85.0" y="267.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">LiDAR</text>
<rect x="365" y="160" width="100" height="70" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="415.0" y="191.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">DDR</text>
<text x="415.0" y="208.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">memory</text>
<rect x="520" y="48" width="460" height="370" rx="10" fill="#fff" stroke="#2f855a" stroke-width="1.5"/>
<text x="750" y="72" font-size="14" font-weight="700" text-anchor="middle" fill="#2f855a">AFTER - DMA subsystem moves data</text>
<rect x="535" y="100" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="585.0" y="127.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Camera</text>
<rect x="535" y="170" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="585.0" y="197.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Radar</text>
<rect x="535" y="240" width="100" height="46" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="585.0" y="267.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">LiDAR</text>
<rect x="865" y="160" width="100" height="70" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="915.0" y="191.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">DDR</text>
<text x="915.0" y="208.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">memory</text>
<rect x="170" y="160" width="120" height="70" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="230.0" y="191.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">CPU</text>
<text x="230.0" y="208.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">load + store</text>
<polyline points="135,123 170,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="135,193 170,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="135,263 170,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="290,195 365,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="327" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">every word</text>
<text x="40" y="330" font-size="12" font-weight="400" text-anchor="start" fill="#c53030" font-style="italic">- CPU busy moving data, not computing</text>
<text x="40" y="350" font-size="12" font-weight="400" text-anchor="start" fill="#c53030" font-style="italic">- latency + jitter under load</text>
<text x="40" y="370" font-size="12" font-weight="400" text-anchor="start" fill="#c53030" font-style="italic">- radar packets wait behind camera copies</text>
<text x="40" y="390" font-size="12" font-weight="400" text-anchor="start" fill="#c53030" font-style="italic">- bottleneck in real-time operation</text>
<rect x="670" y="160" width="120" height="70" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="730.0" y="191.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">DMA</text>
<text x="730.0" y="208.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">4 channels</text>
<rect x="670" y="75" width="120" height="44" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="730.0" y="101.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">CPU</text>
<polyline points="635,123 670,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="635,193 670,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="635,263 670,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="790,195 865,195" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="827" y="186" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">AXI bursts</text>
<polyline points="700,119 700,160" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="694" y="145" font-size="11" font-weight="400" text-anchor="end" fill="#5b6472" font-style="italic">program (APB)</text>
<polyline points="760,160 760,119" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="768" y="145" font-size="11" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">IRQ</text>
<text x="540" y="330" font-size="12" font-weight="400" text-anchor="start" fill="#2f855a" font-style="italic">+ CPU only programs registers and handles IRQs</text>
<text x="540" y="350" font-size="12" font-weight="400" text-anchor="start" fill="#2f855a" font-style="italic">+ bursts use the bus efficiently</text>
<text x="540" y="370" font-size="12" font-weight="400" text-anchor="start" fill="#2f855a" font-style="italic">+ radar (priority 3) served first</text>
<text x="540" y="390" font-size="12" font-weight="400" text-anchor="start" fill="#2f855a" font-style="italic">+ errors reported per channel</text></svg>