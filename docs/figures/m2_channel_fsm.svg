<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Channel life-cycle (implemented with the &#x27;active&#x27; flag)</text>
<circle cx="260" cy="200" r="75" fill="#f1f3f5" stroke="#6b7280" stroke-width="2"/>
<text x="260" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">IDLE</text>
<text x="260" y="217" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6472">active = 0</text>
<circle cx="740" cy="200" r="80" fill="#e7f6ec" stroke="#2f855a" stroke-width="2"/>
<text x="740" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">ACTIVE</text>
<text x="740" y="217" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5b6472">requests bursts</text>
<polyline points="333,180 662,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="497" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">START with valid config</text>
<polyline points="662,222 333,222" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="497" y="242" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">last burst done -&gt; DONE irq</text>
<path d="M 700 272 C 640 360, 360 360, 300 272" fill="none" stroke="#c53030" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="500" y="352" font-size="12" font-weight="400" text-anchor="middle" fill="#c53030">SLVERR / DECERR -&gt; ERR irq + ERR_CODE (restart later with a new START)</text>
<path d="M 210 135 C 150 40, 320 40, 290 128" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="250" y="48" font-size="12" font-weight="400" text-anchor="middle" fill="#b7791f">START with bad config -&gt; ERR_CFG (stays idle)</text>
<path d="M 700 130 C 660 40, 840 40, 790 128" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="745" y="48" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">START while active: ignored</text></svg>