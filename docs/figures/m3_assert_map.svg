<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Where the assertions watch the design (bound with SV &#x27;bind&#x27;)</text>
<rect x="330" y="140" width="340" height="170" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="500.0" y="204.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">dma_top</text>
<text x="500.0" y="221.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937"></text>
<text x="500.0" y="238.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">dma_channel x4   dma_arbiter</text>
<text x="500.0" y="255.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">dma_engine</text>
<rect x="30" y="60" width="250" height="96" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="155.0" y="87.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">APB protocol (4)</text>
<text x="155.0" y="104.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">setup -&gt; access</text>
<text x="155.0" y="120.625" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">stable in setup</text>
<text x="155.0" y="137.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">PREADY, PSLVERR phase</text>
<rect x="30" y="250" width="250" height="80" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="155.0" y="277.875" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">IRQ (1 + 4)</text>
<text x="155.0" y="294.375" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">irq = OR(irq_ch)</text>
<text x="155.0" y="310.875" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">irq_ch = OR(STAT &amp; EN)</text>
<rect x="720" y="40" width="250" height="80" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="845.0" y="67.875" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">AXI handshake (3)</text>
<text x="845.0" y="84.375" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">AW / AR / W stable</text>
<text x="845.0" y="100.875" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">while VALID &amp; !READY</text>
<rect x="720" y="160" width="250" height="96" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="845.0" y="187.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">AXI legality (6)</text>
<text x="845.0" y="204.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">size 4 B, INCR, aligned</text>
<text x="845.0" y="220.625" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">no 4 KB crossing</text>
<text x="845.0" y="237.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">WLAST position, one phase</text>
<rect x="720" y="300" width="250" height="96" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="845.0" y="327.625" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Arbitration (6)</text>
<text x="845.0" y="344.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">grant only to requester</text>
<text x="845.0" y="360.625" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">winner has the highest</text>
<text x="845.0" y="377.125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">priority (x4)</text>
<rect x="330" y="330" width="340" height="80" rx="8" fill="#e6f5f5" stroke="#2c7a7b" stroke-width="1.6"/>
<text x="500.0" y="357.875" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Channel (8 x 4)</text>
<text x="500.0" y="374.375" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">FIFO no under/overflow, s_ready legal,</text>
<text x="500.0" y="390.875" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">req legal, bad START never activates</text>
<polyline points="280,100 330,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="280,290 330,260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="720,80 670,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="720,208 670,220" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="720,348 670,280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="500,330 500,310" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/></svg>