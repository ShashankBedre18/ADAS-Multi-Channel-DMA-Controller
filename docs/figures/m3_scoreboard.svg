<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Scoreboard and checking - independent reference model</text>
<rect x="20" y="60" width="200" height="70" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="120.0" y="91.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">APB monitor</text>
<text x="120.0" y="108.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">every register write</text>
<rect x="20" y="170" width="200" height="70" rx="8" fill="#e6f5f5" stroke="#2c7a7b" stroke-width="1.6"/>
<text x="120.0" y="201.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Stream monitors x4</text>
<text x="120.0" y="218.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">every word a sensor sent</text>
<rect x="20" y="280" width="200" height="70" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="120.0" y="311.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">AXI monitor</text>
<text x="120.0" y="328.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">every burst + response</text>
<rect x="290" y="50" width="260" height="120" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="420.0" y="89.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Channel model x4 (ch_model)</text>
<text x="420.0" y="106.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">built ONLY from APB writes:</text>
<text x="420.0" y="123.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">expected address, remaining,</text>
<text x="420.0" y="140.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">burst size = own min() formula</text>
<rect x="290" y="190" width="260" height="70" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="420.0" y="221.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Expected data</text>
<text x="420.0" y="238.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">memory snapshot at START / sensor queue</text>
<polyline points="220,95 290,110" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="220,205 290,225" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="620" y="50" width="360" height="300" rx="10" fill="#fdf0e2" stroke="#c05621" stroke-width="1.5"/>
<text x="800" y="75" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2937">Checks (any mismatch = UVM_ERROR)</text>
<text x="640" y="105" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">1.  address of every burst</text>
<text x="640" y="139" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">2.  burst length = min(BLEN+1, rem, 4 KB)</text>
<text x="640" y="173" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">3.  data of every beat, in order</text>
<text x="640" y="207" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">4.  no stray burst outside a window</text>
<text x="640" y="241" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">5.  DONE only when all words written</text>
<text x="640" y="275" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">6.  ERR only when an error was injected</text>
<text x="640" y="309" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937">7.  end of test: every channel complete</text>
<polyline points="550,110 620,120" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="550,225 620,220" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="220,315 620,300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="420" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">actual traffic</text>
<rect x="290" y="380" width="690" height="60" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="635.0" y="406.125" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">Mutation check: 4 deliberate RTL bugs injected (data bit flip, ignore priority, no 4 KB split,</text>
<text x="635.0" y="422.625" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2937">wrong error code) - every one was caught.  Proof the checker really checks.</text></svg>