<polyline points="670,365 670,300 460,300 460,220" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="480" y="292" font-size="11" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">cnt indexes buffer</text>
<text x="30" y="460" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">After every burst the engine reports beats moved; the channel adds beats x 4 to both addresses and subtracts beats from remaining.</text></svg>