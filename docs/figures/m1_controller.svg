<text x="130.0" y="262.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Interrupt outputs</text>
<text x="130.0" y="279.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">irq_ch[c] = |(INT_STAT &amp; INT_EN)</text>
<text x="130.0" y="296.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">irq = |irq_ch</text>
<polyline points="300,285 230,275" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="30" y="415" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Control decisions are split: channels decide IF they need the bus, the arbiter decides WHO gets it, the engine decides HOW the burst runs.</text></svg>