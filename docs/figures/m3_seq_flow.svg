<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="250" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">How one stimulus flows: sequence -&gt; driver -&gt; DUT -&gt; monitor -&gt; checkers</text>
<rect x="12" y="80" width="125" height="70" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="74.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">virtual sequence</text>
<text x="74.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">e.g. dma_priority_vseq</text>
<rect x="153" y="80" width="125" height="70" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="215.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">sub-sequence</text>
<text x="215.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">apb write CHn_CTRL</text>
<polyline points="137,115 153,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="294" y="80" width="125" height="70" rx="8" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="356.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">sequencer</text>
<text x="356.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">arbitrates items</text>
<polyline points="278,115 294,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="435" y="80" width="125" height="70" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="497.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">driver</text>
<text x="497.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">drives the pins</text>
<polyline points="419,115 435,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="576" y="80" width="125" height="70" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="638.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">DUT</text>
<text x="638.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">dma_top</text>
<polyline points="560,115 576,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="717" y="80" width="125" height="70" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="779.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">monitor</text>
<text x="779.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">pins -&gt; item</text>
<polyline points="701,115 717,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="858" y="80" width="125" height="70" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="920.5" y="111.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">scoreboard</text>
<text x="920.5" y="127.2" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">+ coverage</text>
<polyline points="842,115 858,115" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="12" y="195" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">start_item() / finish_item() hand the transaction to the driver; item_done() releases the next one.</text>
<text x="12" y="218" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">The AXI side is reactive: the slave driver answers DUT requests from a memory model, with random latency and injected errors.</text></svg>