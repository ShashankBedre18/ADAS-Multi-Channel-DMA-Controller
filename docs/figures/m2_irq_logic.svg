<text x="30" y="368" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">STATUS (read-only) shows ACTIVE, IN_FLIGHT, ERR_CODE and FIFO level; REMAIN and XFERRED show progress.</text></svg>