<text x="290.0" y="325.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Channel 3 window</text>
<text x="290.0" y="342.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">diagnostics</text>
<text x="30" y="398" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">other</text>
