<text x="290.0" y="387.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Unmapped</text>
<text x="290.0" y="404.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">access returns PSLVERR</text>
<text x="720" y="60" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">One channel window (offset from base)</text>
<rect x="480" y="75" width="490" height="31" rx="5" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.2"/>
<text x="490" y="95" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x00</text>
<text x="545" y="95" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">CTRL</text>
<text x="625" y="95" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f5d9a">RW</text>
<text x="665" y="95" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">EN, START, SRC_STREAM, PRIO, BLEN</text>
<rect x="480" y="112" width="490" height="31" rx="5" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.2"/>
