<text x="545" y="132" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">SRC</text>
<text x="625" y="132" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f5d9a">RW</text>
<text x="665" y="132" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">source address (memory mode)</text>
<rect x="480" y="149" width="490" height="31" rx="5" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.2"/>
<text x="490" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x08</text>
<text x="545" y="169" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">DST</text>
<text x="625" y="169" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f5d9a">RW</text>
<text x="665" y="169" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">destination address</text>
<rect x="480" y="186" width="490" height="31" rx="5" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.2"/>
<text x="490" y="206" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x0C</text>
<text x="545" y="206" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">LEN</text>
<text x="625" y="206" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f5d9a">RW</text>
<text x="665" y="206" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">length in words (24 bit)</text>
<rect x="480" y="223" width="490" height="31" rx="5" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.2"/>
<text x="490" y="243" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x10</text>
<text x="545" y="243" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">INT_EN</text>
<text x="625" y="243" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f5d9a">RW</text>
<text x="665" y="243" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">enable DONE / ERR interrupts</text>
<rect x="480" y="260" width="490" height="31" rx="5" fill="#fdf0e2" stroke="#c05621" stroke-width="1.2"/>
<text x="490" y="280" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x14</text>
<text x="545" y="280" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">INT_STAT</text>
<text x="625" y="280" font-size="11.5" font-weight="700" text-anchor="start" fill="#c05621">W1C</text>
<text x="665" y="280" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">DONE / ERR flags</text>
<rect x="480" y="297" width="490" height="31" rx="5" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.2"/>
<text x="490" y="317" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x18</text>
<text x="545" y="317" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">STATUS</text>
<text x="625" y="317" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f855a">RO</text>
<text x="665" y="317" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">ACTIVE, IN_FLIGHT, ERR_CODE, FIFO level</text>
<rect x="480" y="334" width="490" height="31" rx="5" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.2"/>
<text x="490" y="354" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x1C</text>
<text x="545" y="354" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">REMAIN</text>
<text x="625" y="354" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f855a">RO</text>
<text x="665" y="354" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">words left in this transfer</text>
<rect x="480" y="371" width="490" height="31" rx="5" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.2"/>
<text x="490" y="391" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937" font-family="Consolas, monospace">+0x20</text>
<text x="545" y="391" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">XFERRED</text>
<text x="625" y="391" font-size="11.5" font-weight="700" text-anchor="start" fill="#2f855a">RO</text>
<text x="665" y="391" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937">words moved since START</text>
