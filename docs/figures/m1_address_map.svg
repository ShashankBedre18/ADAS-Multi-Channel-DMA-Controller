<polyline points="430,143 478,403" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="30" y="455" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Channel n base = 0x100 + n x 0x40   |   RW = read/write   |   RO = read-only   |   W1C = write 1 to clear</text></svg>