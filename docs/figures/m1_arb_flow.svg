<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">Arbitration scheme - one decision per burst</text>
<rect x="370" y="50" width="260" height="46" rx="8" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="500.0" y="77.55" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Engine idle and &gt;= 1 request</text>
<rect x="370" y="125" width="260" height="52" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="500.0" y="147.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">For every channel c</text>
<text x="500.0" y="164.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">req[c] = active &amp; enabled &amp; data ready</text>
<rect x="370" y="205" width="260" height="52" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="500.0" y="227.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Find the highest PRIO[c]</text>
<text x="500.0" y="244.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">among requesting channels (0..3)</text>
<polygon points="500,285 640,320 500,355 360,320" fill="#fdf8e1" stroke="#b7791f" stroke-width="1.6"/>
<text x="500" y="316" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">more than one channel</text>
<text x="500" y="333" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">with that priority?</text>
<rect x="110" y="295" width="200" height="50" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="210.0" y="316.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">no: that channel</text>
<text x="210.0" y="333.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">wins</text>
<rect x="690" y="295" width="230" height="50" rx="8" fill="#e6f5f5" stroke="#2c7a7b" stroke-width="1.6"/>
<text x="805.0" y="316.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">yes: first one at/after</text>
<text x="805.0" y="333.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">rr_ptr wins (round-robin)</text>
<polyline points="500,96 500,125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="500,177 500,205" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="500,257 500,285" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="360,320 310,320" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="335" y="312" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">no</text>
<polyline points="640,320 690,320" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="665" y="312" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">yes</text>
<rect x="330" y="385" width="340" height="46" rx="8" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.6"/>
<text x="500.0" y="412.55" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">grant_fire: engine takes gnt_idx</text>
<polyline points="210,345 210,408 330,408" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="805,345 805,408 670,408" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="500" y="455" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">then rr_ptr &lt;= winner + 1, so the next tie starts after the last winner</text>
<text x="690" y="120" font-size="12" font-weight="400" text-anchor="start" fill="#1f2937">Why per burst?</text>
<text x="690" y="138" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">A critical sensor waits at most</text>
<text x="690" y="154" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">ONE burst of another channel.</text></svg>