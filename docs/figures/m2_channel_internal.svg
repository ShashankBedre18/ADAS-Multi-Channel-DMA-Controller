<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="500" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">dma_channel - inside one channel controller</text>
<rect x="20" y="45" width="960" height="440" rx="12" fill="#fbfcfe" stroke="#2f5d9a" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="45" y="70" width="200" height="110" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="145.0" y="104.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Config registers</text>
<text x="145.0" y="121.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">EN, PRIO, BLEN,</text>
<text x="145.0" y="138.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">SRC_STREAM, SRC, DST,</text>
<text x="145.0" y="155.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">LEN, INT_EN</text>
<rect x="45" y="210" width="200" height="80" rx="8" fill="#fdf8e1" stroke="#b7791f" stroke-width="1.6"/>
<text x="145.0" y="237.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">START decode</text>
<text x="145.0" y="254.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">cfg check: EN, LEN != 0,</text>
<text x="145.0" y="271.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">word-aligned addresses</text>
<rect x="300" y="70" width="210" height="110" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="405.0" y="104.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Run-time context</text>
<text x="405.0" y="121.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">active, cur_src, cur_dst,</text>
<text x="405.0" y="138.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">remaining, xferred,</text>
<text x="405.0" y="155.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">err_code</text>
<rect x="300" y="210" width="210" height="80" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="405.0" y="237.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Burst sizing</text>
<text x="405.0" y="254.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">min(BLEN+1, remaining,</text>
<text x="405.0" y="271.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">4 KB room)</text>
<rect x="565" y="210" width="180" height="80" rx="8" fill="#f1ecfb" stroke="#6b46c1" stroke-width="1.6"/>
<text x="655.0" y="237.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Request register</text>
<text x="655.0" y="254.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">req_q, nb_q</text>
<text x="655.0" y="271.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">(registered for timing)</text>
<rect x="565" y="70" width="180" height="110" rx="8" fill="#e6f5f5" stroke="#2c7a7b" stroke-width="1.6"/>
<text x="655.0" y="104.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Sensor FIFO</text>
<text x="655.0" y="121.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">dma_sfifo 32 words</text>
<text x="655.0" y="138.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">s_ready = active &amp; !full</text>
<text x="655.0" y="155.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">(full = back-pressure)</text>
<rect x="300" y="330" width="210" height="90" rx="8" fill="#fdecec" stroke="#c53030" stroke-width="1.6"/>
<text x="405.0" y="362.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Interrupt logic</text>
<text x="405.0" y="379.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">INT_STAT (W1C)</text>
<text x="405.0" y="396.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">irq = |(INT_STAT &amp; INT_EN)</text>
<rect x="565" y="330" width="180" height="90" rx="8" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="655.0" y="362.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Read mux</text>
<text x="655.0" y="379.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">CTRL..XFERRED</text>
<text x="655.0" y="396.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">to APB prdata</text>
<polyline points="245,125 300,125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="245,250 300,150" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="255" y="196" font-size="12" font-weight="400" text-anchor="end" fill="#5b6472">start_ok</text>
<polyline points="405,180 405,210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="510,250 565,250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="655,180 655,210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="700" y="200" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">fifo level</text>
<polyline points="145,290 145,375 300,375" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="220" y="368" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">start_bad</text>
<polyline points="820,230 745,230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="830" y="225" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">to arbiter / engine:</text>
<text x="830" y="242" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">req, prio, next_beats,</text>
<text x="830" y="257" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">src/dst address</text>
<polyline points="840,120 745,120" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="850" y="115" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">sensor stream</text>
<text x="850" y="132" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">s_valid / s_data (in)</text>
<polyline points="745,150 840,150" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="850" y="155" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">s_ready (out)</text>
<polyline points="870,330 870,305 535,305 535,160 512,160" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="770" y="350" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">upd, upd_beats, upd_err</text>
<text x="770" y="365" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">from the engine</text>
<polyline points="405,420 405,460" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="415" y="455" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">irq_ch[c]</text>
<text x="45" y="334" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">APB write</text>
<polyline points="135,330 135,292" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/></svg>