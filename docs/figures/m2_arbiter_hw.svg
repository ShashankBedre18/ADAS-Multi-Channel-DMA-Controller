<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="360" fill="#ffffff"/>
<text x="500.0" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">dma_arbiter - hardware structure</text>
<rect x="30" y="60" width="230" height="48" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="145.0" y="88.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">req[0], PRIO[0]  (from channel 0)</text>
<polyline points="260,84 380,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="125" width="230" height="48" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="145.0" y="153.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">req[1], PRIO[1]  (from channel 1)</text>
<polyline points="260,149 380,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="190" width="230" height="48" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="145.0" y="218.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">req[2], PRIO[2]  (from channel 2)</text>
<polyline points="260,214 380,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="30" y="255" width="230" height="48" rx="8" fill="#e8f0fb" stroke="#2f5d9a" stroke-width="1.6"/>
<text x="145.0" y="283.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">req[3], PRIO[3]  (from channel 3)</text>
<polyline points="260,279 380,180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="380" y="100" width="260" height="160" rx="8" fill="#fdf0e2" stroke="#c05621" stroke-width="1.6"/>
<text x="510.0" y="150.55" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Rotating scan</text>
<text x="510.0" y="167.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">for i in 0..3:</text>
<text x="510.0" y="184.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">idx = (rr_ptr + i) % 4</text>
<text x="510.0" y="201.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">keep the first requester with</text>
<text x="510.0" y="218.55" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">a strictly higher PRIO</text>
<rect x="720" y="90" width="240" height="70" rx="8" fill="#e7f6ec" stroke="#2f855a" stroke-width="1.6"/>
<text x="840.0" y="121.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">gnt_valid, gnt_idx</text>
<text x="840.0" y="138.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">to the engine</text>
<rect x="720" y="220" width="240" height="70" rx="8" fill="#e6f5f5" stroke="#2c7a7b" stroke-width="1.6"/>
<text x="840.0" y="251.05" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">rr_ptr register</text>
<text x="840.0" y="268.05" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937">&lt;= gnt_idx + 1 on grant_fire</text>
<polyline points="640,150 720,125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="840,160 840,220" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<polyline points="720,255 640,240" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="680" y="236" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6472">rr_ptr</text>
<text x="380" y="300" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Only one 2-bit register (rr_ptr) and combinational compare logic - very small.</text></svg>