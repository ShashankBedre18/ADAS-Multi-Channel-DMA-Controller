<text x="40" y="400" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Control plane = APB (slow, simple).  Data plane = AXI4 bursts (fast).  The DMA is a slave on APB and a master on AXI.</text></svg>