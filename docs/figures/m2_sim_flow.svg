<text x="20" y="200" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937">One command:  sim\regress.bat  (Windows)  or  sim/regress.sh  (Git Bash)</text>
<text x="20" y="225" font-size="12" font-weight="400" text-anchor="start" fill="#5b6472" font-style="italic">Single test with waveform:  xsim tb_snap -testplusarg UVM_TESTNAME=dma_smoke_test -testplusarg WAVES -R</text></svg>